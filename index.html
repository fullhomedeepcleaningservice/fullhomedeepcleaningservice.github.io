<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Full Home Deep Cleaning Service</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
window.services = {
  '1bhk_unf': { name: '1 BHK Unfurnished', price: 2499, sub: '1 Hall, 1 Kitchen, 1 Bath, 1 Balcony (Empty)', fur: false, count: 0 },
  '1bhk_fur': { name: '1 BHK Furnished', price: 3299, sub: '1 Hall, 1 Kitchen, 1 Bath, 1 Balcony (Furnished)', fur: true, count: 0 },
  '2bhk_unf': { name: '2 BHK Unfurnished', price: 3299, sub: '2 Beds, 1 Hall, Kitchen, 2 Baths, 2 Balconies (Empty)', fur: false, count: 0 },
  '2bhk_fur': { name: '2 BHK Furnished', price: 4499, sub: '2 Beds, Hall, Kitchen, 2 Baths, 2 Balconies (Furnished)', fur: true, count: 0 },
  '3bhk_unf': { name: '3 BHK Unfurnished', price: 4499, sub: '3 Beds, 1 Hall, Kitchen, 3 Baths, 3 Balconies (Empty)', fur: false, count: 0 },
  '3bhk_fur': { name: '3 BHK Furnished', price: 5499, sub: '3 Beds, Hall, Kitchen, 3 Baths, 3 Balconies (Furnished)', fur: true, count: 0 },
  '4bhk_unf': { name: '4 BHK Unfurnished', price: 5499, sub: '4 Beds, Hall, Kitchen, 4 Baths, 4 Balconies (Empty)', fur: false, count: 0 },
  '4bhk_fur': { name: '4 BHK Furnished', price: 6999, sub: '4 Beds, Hall, Kitchen, 4 Baths, 4 Balconies (Furnished)', fur: true, count: 0 },
  'villa_deep': { name: 'Luxury Independent Villa Deep Cleaning', price: 7500, sqFt: 1500, sub: 'Multi-Floor Independent House / Duplex Villa', fur: false, count: 0 },
  'kitchen': { name: 'Kitchen Deep Clean', price: 1499, sub: 'Chimney, stove, sink & tile degrease', fur: false, count: 0 },
  'bathroom': { name: 'Bathroom Deep Clean', price: 399, sub: 'Tile descaling & commode deep wash', fur: false, count: 0 },
  'living': { name: 'Living Room & Sofa', price: 699, sub: 'Sofa shampooing & floor polish', fur: true, count: 0 },
  'window': { name: 'Window Glass & Grill', price: 199, sub: 'Squeegee wiper & track suction', fur: false, count: 0 },
  'addon_ceiling': { name: 'Ceiling dusting & cobweb cleaning', price: 199, sub: 'Add-on service', fur: false, count: 0 },
  'addon_sofa': { name: 'Sofa & upholstery wet shampooing', price: 149, sub: 'Add-on service', fur: false, count: 0 },
  'addon_balcony': { name: 'Balcony deep cleaning', price: 499, sub: 'Add-on service', fur: false, count: 0 }
};

window.authOtp = '';
window.isAuth = false;
window.userPhone = '';
window.mapObj = null;
window.markerObj = null;
window.pinLat = 17.4190;
window.pinLng = 78.3489;
window.pinAddr = '';

window.getTotal = function() {
  var t = 0;
  for (var k in window.services) {
    if (window.services[k].count > 0) t += window.services[k].price * window.services[k].count;
  }
  return t;
};

window.syncUI = function() {
  var c = 0;
  for (var k in window.services) {
    var s = window.services[k];
    c += s.count;
    var btn = document.getElementById('btn-' + k);
    if (btn) {
      if (k === 'villa_deep') btn.textContent = s.count > 0 ? 'Added ✓' : '+ Add Villa Clean';
      else if (k.indexOf('addon_') === 0) btn.textContent = s.count > 0 ? '✓ Added' : 'Add';
      else btn.textContent = s.count > 0 ? '✓' : '+ Add';
      btn.style.backgroundColor = s.count > 0 ? '#5c3cd6' : '';
      btn.style.color = s.count > 0 ? '#ffffff' : '';
    }
  }
  var tot = window.getTotal();
  var bar = document.getElementById('homeBottomBar');
  if (bar) bar.style.display = c > 0 ? 'flex' : 'none';
  if (document.getElementById('bottomTotalPrice')) document.getElementById('bottomTotalPrice').textContent = '₹' + tot.toLocaleString('en-IN');
  if (document.getElementById('bottomItemCount')) document.getElementById('bottomItemCount').textContent = c + (c === 1 ? ' service' : ' services');
  if (document.getElementById('navCartCount')) document.getElementById('navCartCount').textContent = c;
  if (document.getElementById('billFinalAmount')) document.getElementById('billFinalAmount').textContent = '₹' + tot.toLocaleString('en-IN');
  if (document.getElementById('billItemTotal')) document.getElementById('billItemTotal').textContent = '₹' + tot.toLocaleString('en-IN');
};

window.toggleItem = function(key) {
  if (!window.services[key]) return;
  window.services[key].count = window.services[key].count > 0 ? 0 : 1;
  window.syncUI();
  if (!document.getElementById('cartScreen').classList.contains('hidden')) window.renderCart();
};

window.updateVilla = function(val) {
  var sq = parseInt(val) || 500;
  window.services['villa_deep'].sqFt = sq;
  window.services['villa_deep'].price = sq * 5;
  var el = document.getElementById('price-display-villa_deep');
  if (el) el.textContent = '₹' + window.services['villa_deep'].price.toLocaleString('en-IN');
  window.syncUI();
};

window.goAbout = function() {
  window.showScreen('catalogScreen');
  var ab = document.getElementById('aboutSection');
  var sc = document.getElementById('catalogScreen');
  if (ab && sc) sc.scrollTop = ab.offsetTop - 15;
};

window.showScreen = function(id) {
  ['catalogScreen', 'cartScreen', 'addressScreen'].forEach(function(s) {
    var el = document.getElementById(s);
    if (el) {
      if (s === id) el.classList.remove('hidden');
      else el.classList.add('hidden');
    }
  });
  if (id === 'catalogScreen') window.syncUI();
  else document.getElementById('homeBottomBar').style.display = 'none';
};

window.openCart = function() {
  var c = 0;
  for (var k in window.services) c += window.services[k].count;
  if (c === 0) { alert('Please add at least 1 service first.'); return; }
  window.renderCart();
  window.showScreen('cartScreen');
};

window.renderCart = function() {
  var box = document.getElementById('cartScreenItems');
  if (!box) return;
  var html = '';
  for (var k in window.services) {
    var s = window.services[k];
    if (s.count > 0) {
      html += '<div class="py-3 flex justify-between items-start">' +
        '<div><h4 class="text-sm font-bold text-slate-900">' + s.name + '</h4>' +
        '<p class="text-xs text-slate-500">' + s.sub + '</p></div>' +
        '<div class="text-right"><span class="text-sm font-bold text-slate-900 block">₹' + s.price.toLocaleString('en-IN') + '</span>' +
        '<button onclick="window.toggleItem(\'' + k + '\')" type="button" class="text-rose-500 font-bold text-xs mt-1 bg-rose-50 px-2.5 py-1 rounded">Remove</button></div></div>';
    }
  }
  box.innerHTML = html;
  window.syncUI();
};

window.openDetails = function(key) {
  var s = window.services[key];
  if (!s) return;
  document.getElementById('detailModalTitle').textContent = s.name;
  document.getElementById('detailModalSubtitle').textContent = s.sub;
  document.getElementById('detailModalPrice').textContent = '₹' + s.price.toLocaleString('en-IN');
  var scopeHtml = s.fur
    ? '<div class="bg-slate-50 border border-slate-200 rounded-xl p-3 space-y-1.5 text-xs text-slate-700">' +
      '<p>✓ Single-disc rotary machine floor scrubbing & buffing</p>' +
      '<p>✓ Sofa & mattress dry vacuum dust extraction</p>' +
      '<p>✓ Bathroom hard water descaling, commode & taps mirror polish</p>' +
      '<p>✓ Kitchen exterior cabinets, stove & tiles degreasing</p>' +
      '<p>✓ Balcony wash, grills, windows, fans & cobweb removal</p></div>'
    : '<div class="bg-slate-50 border border-slate-200 rounded-xl p-3 space-y-1.5 text-xs text-slate-700">' +
      '<p>✓ Industrial rotary machine floor scrubbing & stain removal</p>' +
      '<p>✓ Inside & outside cleaning of all empty cabinets & wardrobes</p>' +
      '<p>✓ Bathroom tiles descaling, commode deep wash & chrome polish</p>' +
      '<p>✓ Kitchen platform, sink, tiles & exhaust degreasing</p>' +
      '<p>✓ Windows, grills, slider tracks, balcony & cobweb cleaning</p></div>';
  document.getElementById('detailSectionsContainer').innerHTML = scopeHtml;
  var nb = document.getElementById('furnishedNoticeBlock');
  if (s.fur) nb.classList.remove('hidden'); else nb.classList.add('hidden');
  document.getElementById('detailsModalBackdrop').classList.remove('hidden');
};

window.closeDetails = function() {
  document.getElementById('detailsModalBackdrop').classList.add('hidden');
};

window.openAuth = function() {
  if (window.isAuth) { window.goAddress(); return; }
  document.getElementById('sheetOtpBlock').classList.add('hidden');
  document.getElementById('sheetContinueBtn').textContent = 'Continue';
  document.getElementById('phoneAuthModal').classList.remove('hidden');
};

window.closeAuth = function() {
  document.getElementById('phoneAuthModal').classList.add('hidden');
};

window.stepAuth = function() {
  var ph = document.getElementById('sheetPhoneInput').value.trim();
  if (!/^\d{10}$/.test(ph)) { alert('Enter a valid 10-digit mobile number.'); return; }
  var otpBox = document.getElementById('sheetOtpBlock');
  if (otpBox.classList.contains('hidden')) {
    window.userPhone = ph;
    window.authOtp = Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById('sheetCodeDisplay').textContent = window.authOtp;
    otpBox.classList.remove('hidden');
    document.getElementById('sheetContinueBtn').textContent = 'Verify & Proceed';
    return;
  }
  if (document.getElementById('sheetOtpInput').value.trim() === window.authOtp) {
    window.isAuth = true;
    window.closeAuth();
    window.goAddress();
  } else {
    alert('Incorrect 4-digit code.');
  }
};

window.goAddress = function() {
  window.showScreen('addressScreen');
  document.getElementById('displayVerifiedPhone').textContent = '+91 ' + window.userPhone;
  document.getElementById('addressBillTotal').textContent = '₹' + window.getTotal().toLocaleString('en-IN');
  var dp = document.getElementById('custDate');
  if (dp && !dp.value) dp.value = new Date().toISOString().split('T')[0];
};

window.openMap = function() {
  var m = document.getElementById('pinMapModal');
  m.classList.remove('hidden');
  m.classList.add('flex');
  setTimeout(function() {
    if (!window.mapObj && typeof L !== 'undefined') {
      window.mapObj = L.map('leafletPinMap').setView([window.pinLat, window.pinLng], 16);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(window.mapObj);
      window.markerObj = L.marker([window.pinLat, window.pinLng], { draggable: true }).addTo(window.mapObj);
      window.mapObj.on('click', function(e) { window.setPin(e.latlng.lat, e.latlng.lng); });
      window.markerObj.on('dragend', function(e) { var p = e.target.getLatLng(); window.setPin(p.lat, p.lng); });
    } else if (window.mapObj) {
      window.mapObj.invalidateSize();
    }
    window.gpsMap();
  }, 150);
};

window.setPin = function(lat, lng) {
  window.pinLat = lat;
  window.pinLng = lng;
  if (window.mapObj && window.markerObj) {
    window.mapObj.setView([lat, lng], 17);
    window.markerObj.setLatLng([lat, lng]);
  }
  document.getElementById('pinCoordsText').textContent = lat.toFixed(6) + ', ' + lng.toFixed(6);
  fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lng)
    .then(function(r) { return r.json(); })
    .then(function(d) {
      window.pinAddr = (d && d.display_name) ? d.display_name : '';
      document.getElementById('modalPinAddressText').textContent = window.pinAddr || (lat.toFixed(6) + ', ' + lng.toFixed(6));
    }).catch(function() {});
};

window.gpsMap = function() {
  if (!navigator.geolocation) return;
  document.getElementById('modalPinAddressText').textContent = 'Detecting GPS location...';
  navigator.geolocation.getCurrentPosition(function(pos) {
    window.setPin(pos.coords.latitude, pos.coords.longitude);
  }, function() {
    document.getElementById('modalPinAddressText').textContent = 'Tap on map or search area above.';
  }, { enableHighAccuracy: true, timeout: 8000 });
};

window.searchMap = function() {
  var q = document.getElementById('mapSearchInput').value.trim();
  if (!q) return;
  fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q))
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d && d.length > 0) window.setPin(parseFloat(d[0].lat), parseFloat(d[0].lon));
      else alert('Location not found.');
    }).catch(function() {});
};

window.confirmMap = function() {
  var link = 'https://www.google.com/maps?q=' + window.pinLat.toFixed(6) + ',' + window.pinLng.toFixed(6);
  document.getElementById('custMapLink').value = link;
  if (window.pinAddr) {
    document.getElementById('custArea').value = window.pinAddr;
  }
  document.getElementById('pinMapModal').classList.add('hidden');
  document.getElementById('pinMapModal').classList.remove('flex');
};

window.sendWhatsApp = function() {
  var name = document.getElementById('custName').value.trim();
  var date = document.getElementById('custDate').value;
  var slot = document.getElementById('custSlot').value;
  var apt = document.getElementById('custApt').value.trim();
  var block = document.getElementById('custBlock').value.trim();
  var flat = document.getElementById('custFlat').value.trim();
  var area = document.getElementById('custArea').value.trim();
  var mapLink = document.getElementById('custMapLink').value.trim();

  if (!name) { alert('Please enter your Full Name.'); document.getElementById('custName').focus(); return; }
  if (!apt) { alert('Please enter Apartment / Building Name.'); document.getElementById('custApt').focus(); return; }
  if (!flat) { alert('Please enter Flat / Door Number.'); document.getElementById('custFlat').focus(); return; }
  if (!area) { alert('Please pin location or enter Area / Landmark.'); document.getElementById('custArea').focus(); return; }

  var items = [];
  for (var k in window.services) {
    if (window.services[k].count > 0) items.push(window.services[k].name + ' (₹' + window.services[k].price + ')');
  }
  var msg = '*New Booking - Full Home Deep Cleaning Service*\n\n' +
    '👤 *Customer Name:* ' + name + '\n' +
    '📱 *Verified Phone:* ' + window.userPhone + '\n' +
    '🧹 *Booked Services:*\n• ' + items.join('\n• ') + '\n\n' +
    '💰 *Total Amount:* ₹' + window.getTotal().toLocaleString('en-IN') + '\n' +
    '📅 *Date & Time:* ' + date + ' at ' + slot + '\n\n' +
    '🏢 *Apartment / Society:* ' + apt + '\n' +
    '🏗️ *Block / Tower:* ' + (block ? block : 'N/A') + '\n' +
    '🚪 *Flat / Door No.:* ' + flat + '\n' +
    '📍 *Area / Landmark:* ' + area + '\n' +
    (mapLink ? '🗺️ *Google Maps Link:* ' + mapLink : '');

  window.open('https://wa.me/919908093964?text=' + encodeURIComponent(msg), '_blank');
};
</script>
